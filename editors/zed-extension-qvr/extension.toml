id = "qvr"
name = "QVR"
description = "Syntax highlighting for the Quivers DSL (.qvr files)."
version = "0.3.0"
schema_version = 1
authors = ["Aaron Steven White <aaronstevenwhite@gmail.com>"]
repository = "https://github.com/FACTSlab/quivers"

[grammars.qvr]
repository = "https://github.com/FACTSlab/quivers"
# Immutable commit containing the QVR v0.19 grammar. Update this pin whenever
# grammar.js or its generated parser/query assets change.
commit = "afa858dd6f13956ae8739ef92e6717f800bc390c"
path = "grammars/qvr"

[language_servers.qvr-lsp]
name = "QVR Language Server"
languages = ["qvr"]
binary.path = "qvr-lsp"
binary.arguments = []
