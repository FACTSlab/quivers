name: Bug report
description: Report unexpected behaviour, a crash, or a numerical correctness issue.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please give a
        minimal reproducer when possible.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A short description of the bug.
      placeholder: One or two sentences.
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Reproducer
      description: A minimal Python or `.qvr` snippet that triggers the issue.
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the full traceback if there is one.
    validations:
      required: true

  - type: input
    id: quivers-version
    attributes:
      label: quivers version
      placeholder: "e.g. 0.1.0 or commit SHA"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "e.g. 3.14.0"
    validations:
      required: true

  - type: input
    id: torch-version
    attributes:
      label: PyTorch version
      placeholder: "e.g. 2.4.0"
    validations:
      required: true

  - type: input
    id: panproto-version
    attributes:
      label: panproto / didactic versions
      description: Output of `pip show panproto didactic | grep -i version`.
      placeholder: "e.g. panproto 0.45.0 / didactic 0.6.0"

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else relevant — environment, OS, GPU, etc.
