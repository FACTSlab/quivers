name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Pinned to the line the tree is clean under. Unpinned, a
      # linter release adds rules and every branch goes red at
      # once, for a change nobody in this repository made.
      - run: pip install 'ruff>=0.15,<0.16'
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: pyright src/quivers

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # `tests/transpile/test_external_syntax.py` checks each emitted
      # program against the real parser for its language, and every
      # such check that finds no binary on PATH reports a gap rather
      # than a pass. The four toolchains it needs are installed here:
      # Scheme for the Church runtime's arity shims, JAGS for the JAGS
      # and BUGS model files, `stanc` for Stan, and Julia for Turing
      # and Gen.
      - run: sudo apt-get update && sudo apt-get install -y chezscheme jags
      - name: Install stanc
        run: |
          curl -fsSL -o "$RUNNER_TEMP/stanc" \
            https://github.com/stan-dev/stanc3/releases/download/v2.39.0/linux-stanc
          sudo install -m 0755 "$RUNNER_TEMP/stanc" /usr/local/bin/stanc
          stanc --version
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      # `test_audit_fix_pymc` imports pymc to check the emission
      # against the library's own API rather than against a
      # transcript of it, so the library has to be here: without
      # it the module fails to import and the whole job errors.
      - run: pip install -e ".[dev,data,diagnostics,formulas,repl,lsp]" pymc
      # The transpile suite refuses to skip on a missing probe image
      # and builds all nine instead, which is most of this job's
      # runtime. They change only when their Dockerfiles do, so the
      # built images are cached against a hash of that directory and
      # loaded back in one archive: `docker save` over all nine shares
      # the base layers between them rather than storing each whole.
      - name: Restore probe images
        id: probe-images
        uses: actions/cache@v4
        with:
          path: ~/.cache/qvr-probe-images
          key: qvr-probe-images-${{ hashFiles('tests/transpile/docker/**') }}
      - name: Load probe images
        if: steps.probe-images.outputs.cache-hit == 'true'
        run: gunzip -c ~/.cache/qvr-probe-images/images.tar.gz | docker load
      # No `-x`: one failure used to hide every test behind it,
      # so a run bought one diagnosis and left the rest
      # unexercised. The run reports all of them.
      - run: python -m pytest tests/ -q
      - name: Save probe images
        if: always() && steps.probe-images.outputs.cache-hit != 'true'
        run: |
          images=$(docker images --format '{{ .Repository }}:{{ .Tag }}' | grep '^panproto-test-' || true)
          if [ -n "$images" ]; then
            mkdir -p ~/.cache/qvr-probe-images
            # shellcheck disable=SC2086
            docker save $images | gzip -1 > ~/.cache/qvr-probe-images/images.tar.gz
          fi

  # The default addopts deselect `slow`, so the gallery sweep and the
  # recovery benchmarks never run in the `test` job. They gate here
  # instead: an example whose prose or code stops matching the library
  # fails CI rather than rotting unnoticed.
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # `test_audit_fix_pymc` imports pymc to check the emission
      # against the library's own API rather than against a
      # transcript of it, so the library has to be here: without
      # it the module fails to import and the whole job errors.
      - run: pip install -e ".[dev,data,diagnostics,formulas,repl,lsp]" pymc
      - run: python -m pytest tests/ -m slow -q
