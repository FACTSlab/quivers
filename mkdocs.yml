site_name: Quivers
site_description: V-enriched categorical relations as differentiable PyTorch tensors
site_author: Aaron Steven White
site_url: https://factslab.io/quivers/

theme:
  name: terminal
  custom_dir: docs/overrides
  features:
    # Promote each section's `Overview` child into the section
    # heading so the parent label itself is clickable, instead of
    # appearing as inert grey text alongside its children.
    - navigation.side.indexes

extra:
  # Pair with `navigation.side.indexes`: the child whose nav title
  # matches this is treated as the section's index page.
  INDEX_PAGE_NAV_TITLE: Overview

extra_css:
  - css/pygments.css
  - css/custom.css

extra_javascript:
  - js/mathjax.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js
  - js/mermaid-init.js
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - js/tabbed.js

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      use_pygments: true
      guess_lang: false
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - attr_list
  - def_list
  - footnotes

hooks:
  - docs/hooks/register_qvr_lexer.py
  - docs/hooks/sync_changelog.py

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            docstring_style: numpy
            docstring_section_style: spacy
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            heading_level: 2

