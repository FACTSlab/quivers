[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quivers"
version = "0.2.0"
description = "Computational category theory as differentiable tensor programs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.14"
authors = [{name = "Aaron Steven White"}]
keywords = [
    "category-theory",
    "enriched-categories",
    "pytorch",
    "tensor",
    "probabilistic-programming",
    "quantale",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "torch>=2.0",
    "didactic>=0.6.0",
    "panproto>=0.45.0",
    "panproto-grammars-all>=0.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "pyright",
]
docs = [
    "mkdocs",
    "mkdocstrings[python]",
    "mkdocs-cinder",
    "pymdown-extensions",
    "pygments",
]

[project.urls]
Homepage = "https://github.com/FACTSlab/quivers"
Repository = "https://github.com/FACTSlab/quivers"
Documentation = "https://FACTSlab.github.io/quivers"
Changelog = "https://github.com/FACTSlab/quivers/blob/main/CHANGELOG.md"

[project.entry-points."pygments.lexers"]
qvr = "quivers.dsl.pygments_lexer:QvrLexer"

[tool.hatch.build.targets.wheel]
packages = ["src/quivers"]

[tool.ruff.lint]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src/quivers"]
pythonVersion = "3.14"
# torch's __all__ omits most of its public surface, so every torch.*
# access trips reportPrivateImportUsage. This is upstream torch typing
# behaviour, not a quivers concern.
reportPrivateImportUsage = "none"
# didactic's dx.Model field descriptors widen access to the FieldValue
# union (str | int | float | bytes | Decimal | tuple[FieldValue, ...]),
# which pyright cannot narrow back to the declared annotation without
# explicit casts at every call site. Suppress until didactic ships
# typed field descriptors.
reportArgumentType = "none"
reportOperatorIssue = "none"
